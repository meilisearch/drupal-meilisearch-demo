# Meili Kitchen on Fly.io, with Meilisearch Cloud. See README, "Deploy".
app = "meili-kitchen"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  TRUSTED_HOST_PATTERNS = '^meili-kitchen\.fly\.dev$'
  MEILISEARCH_INDEX_PREFIX = "meili_kitchen_"

# The SQLite database, the hash salt and uploads.
[mounts]
  source = "drupal_files"
  destination = "/opt/drupal/web/sites/default/files"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "10s"
    # The first start installs Drupal and indexes the recipes.
    grace_period = "5m"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
