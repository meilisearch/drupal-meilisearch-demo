# Meili Kitchen: drupal/meilisearch demo.
#   docker compose up --build      # then open http://localhost:8080
#   docker compose watch           # live-sync theme, demo module and the Meilisearch module
services:
  meilisearch:
    image: getmeili/meilisearch:${MEILISEARCH_VERSION:-v1.54}
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-kitchen-demo-key}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 2s
      timeout: 5s
      retries: 30

  drupal:
    build:
      context: .
      additional_contexts:
        module: ${MEILISEARCH_MODULE_PATH:-../../_sdk/meilisearch-drupal}
    environment:
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:-meili-kitchen-demo-key}
      DEMO_PORT: ${DEMO_PORT:-8080}
    ports:
      - "${DEMO_PORT:-8080}:80"
    volumes:
      - drupal_files:/opt/drupal/web/sites/default/files
    depends_on:
      meilisearch:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./web/themes/custom
          target: /opt/drupal/web/themes/custom
        - action: sync
          path: ./web/modules/custom
          target: /opt/drupal/web/modules/custom
        - action: sync
          path: ${MEILISEARCH_MODULE_PATH:-../../_sdk/meilisearch-drupal}/src
          target: /opt/meilisearch-module/src
        - action: rebuild
          path: ./Dockerfile

volumes:
  meili_data:
  drupal_files:
