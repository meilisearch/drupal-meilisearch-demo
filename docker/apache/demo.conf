# Browsers share localhost cookies across ports, so other local apps can
# push the Cookie header past Apache's 8 KB default and every request
# fails with "400 Bad Request". Allow larger headers.
LimitRequestFieldSize 65536
LimitRequestLine 65536
ServerName localhost

# A demo has no place in search results. The header covers every response
# (pages, files, errors); robots.txt stays open, since a crawler that cannot
# fetch a page never sees its noindex.
Header always set X-Robots-Tag "noindex, nofollow"
