; Drupal loads more PHP files than the image's OPcache defaults hold, which
; makes every uncached page recompile code. Room for all of them:
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.revalidate_freq=1
realpath_cache_ttl=600
memory_limit=256M
apc.enable_cli=1
apc.shm_size=128M
